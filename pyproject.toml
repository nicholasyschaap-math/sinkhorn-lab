[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sinkhorn-lab"
version = "0.0.0"
description = "Entropic optimal transport with Sinkhorn: vanilla and log-domain solvers."
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
