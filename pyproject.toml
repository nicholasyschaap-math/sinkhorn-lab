[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sinkhorn-lab"
version = "0.1.0"
description = "Entropic optimal transport with Sinkhorn: vanilla and log-domain solvers."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pot",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
